name: Dependency Advisory Review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.22.0'
      - name: Read-only full-lock and production advisory queries
        env:
          MTG_AUDIT_PYTHON: python
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/review-dependency-advisories.sh
      - name: Reports including failed queries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-advisories-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mtg-advisory-review-*/revision.txt
            ${{ runner.temp }}/mtg-advisory-review-*/inputs.sha256
            ${{ runner.temp }}/mtg-advisory-review-*/*.json
            ${{ runner.temp }}/mtg-advisory-review-*/*.exit
            ${{ runner.temp }}/mtg-advisory-review-*/*.stderr
            ${{ runner.temp }}/mtg-advisory-review-*/*version.txt
            ${{ runner.temp }}/mtg-advisory-review-*/auditor-install.log
          retention-days: 7
