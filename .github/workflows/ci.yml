name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend metadata reporter tests
        run: python -m unittest discover -s .github/scripts/tests -v
      - name: Backend tests
        id: backend_tests
        env:
          MTG_HEAT_WITNESS_01: ${{ secrets.MTG_HEAT_WITNESS_01 }}
          MTG_HEAT_WITNESS_02: ${{ secrets.MTG_HEAT_WITNESS_02 }}
          MTG_HEAT_WITNESS_03: ${{ secrets.MTG_HEAT_WITNESS_03 }}
          MTG_HEAT_WITNESS_04: ${{ secrets.MTG_HEAT_WITNESS_04 }}
          MTG_HEAT_WITNESS_05: ${{ secrets.MTG_HEAT_WITNESS_05 }}
          MTG_HEAT_WITNESS_06: ${{ secrets.MTG_HEAT_WITNESS_06 }}
          MTG_HEAT_WITNESS_07: ${{ secrets.MTG_HEAT_WITNESS_07 }}
          MTG_HEAT_WITNESS_08: ${{ secrets.MTG_HEAT_WITNESS_08 }}
          MTG_HEAT_WITNESS_09: ${{ secrets.MTG_HEAT_WITNESS_09 }}
          MTG_HEAT_WITNESS_10: ${{ secrets.MTG_HEAT_WITNESS_10 }}
          MTG_HEAT_WITNESS_11: ${{ secrets.MTG_HEAT_WITNESS_11 }}
          MTG_HEAT_WITNESS_12: ${{ secrets.MTG_HEAT_WITNESS_12 }}
          MTG_HEAT_WITNESS_13: ${{ secrets.MTG_HEAT_WITNESS_13 }}
        run: |
          bash .github/scripts/run-backend-ci.sh
      - name: Generate backend metadata
        id: backend_metadata
        if: ${{ always() }}
        env:
          BACKEND_EVIDENCE: ${{ steps.backend_tests.outputs.evidence }}
        run: |
          metadata=$(mktemp -d "$RUNNER_TEMP/mtg-backend-metadata-XXXXXX" 2>/dev/null) || {
            printf 'CI_BACKEND_METADATA_SETUP_ERROR\n' >&2
            exit 2
          }
          printf 'metadata_file=%s\n' "$metadata/backend-metadata.json" 2>/dev/null >> "$GITHUB_OUTPUT" || {
            printf 'CI_BACKEND_METADATA_SETUP_ERROR\n' >&2
            exit 2
          }
          status=0
          python .github/scripts/ci_backend_metadata.py "$BACKEND_EVIDENCE" "$GITHUB_WORKSPACE" \
            "$metadata/backend-metadata.json" 2>/dev/null > "$metadata/reporter.log" 2>&1 || status=$?
          if ((status != 0)); then
            printf 'CI_BACKEND_METADATA_FAILED\n' >&2
            exit "$status"
          fi
          printf 'CI_BACKEND_METADATA_READY\n'
      - name: Upload backend metadata
        if: ${{ always() && steps.backend_metadata.outputs.metadata_file != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.backend_metadata.outputs.metadata_file }}
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install backend fixture dependencies
        run: python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Frontend unit tests
        working-directory: frontend
        env:
          MTG_TEST_PYTHON: python
        run: npm test

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm --prefix frontend ci
      - name: Browser action and recovery flows
        env:
          MTG_BROWSER_NO_SANDBOX: '1'
        run: bash frontend/tests/run-browser-ci.sh
